# SPDX-License-Identifier: Apache-2.0
name: NCCL Example
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build pinned EX24 and run CPU oracle only
        run: docker build --platform linux/amd64 -t ex24-build examples/ex24-nccl-all-reduce
