          mapfile -t contract_files < <(node -e "const p=require('./examples/ex15-tiled-gemm/project.json'); for (const f of new Set([...p.build.inputs,...p.build.hostTestInputs,...p.build.contractFiles])) console.log(p.root+'/'+f)")
