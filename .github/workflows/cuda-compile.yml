          docker buildx version

      - name: Compile EX01 without granting Evidence Status
        run: |
          mkdir -p "artifacts/cuda-ex01/${{ matrix.lane }}"
          docker pull --platform linux/amd64 "${{ matrix.image }}"
          docker run --platform linux/amd64 --rm --network none \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace/examples/ex01-environment-report \
            "${{ matrix.image }}" \
            bash scripts/compile-check.sh c++17 "${{ matrix.cudart }}" \
            "/workspace/artifacts/cuda-ex01/${{ matrix.lane }}"

      - name: Scan EX01 build logs
        run: node scripts/check-artifacts.mjs "artifacts/cuda-ex01/${{ matrix.lane }}"

      - name: Upload EX01 build-gate logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
