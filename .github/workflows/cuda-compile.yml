# SPDX-License-Identifier: Apache-2.0
name: CUDA Compile Evidence

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cuda-compile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.19.0

jobs:
  cuda-compile:
    name: ${{ matrix.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: cuda-11-8-cxx17
            toolkit_lane: cuda-11.8
            dialect: c++17
            kind: ex02
            image: nvidia/cuda:11.8.0-devel-ubuntu22.04@sha256:94fd755736cb58979173d491504f0b573247b1745250249415b07fefc738e41f
          - lane: cuda-12-9-cxx17
            toolkit_lane: cuda-12.9
            dialect: c++17
            kind: ex02
            image: nvidia/cuda:12.9.2-devel-ubuntu24.04@sha256:16656a1ef115bca9e1f820c6349876f1486d2b3c9a0e615773799fe402960dc5
          - lane: cuda-12-9-cxx20
            toolkit_lane: cuda-12.9
            dialect: c++20
            kind: ex02
            image: nvidia/cuda:12.9.2-devel-ubuntu24.04@sha256:16656a1ef115bca9e1f820c6349876f1486d2b3c9a0e615773799fe402960dc5
          - lane: cuda-13-3-cxx17
            toolkit_lane: cuda-13.3
            dialect: c++17
            kind: ex02
            image: nvidia/cuda:13.3.1-devel-ubuntu24.04@sha256:4ff859525f99de5782aa73607ce24219b07dddd48d12b97c1c301d7e1cfb0a87
          - lane: cuda-13-3-cxx20
            toolkit_lane: cuda-13.3
            dialect: c++20
            kind: ex02
            image: nvidia/cuda:13.3.1-devel-ubuntu24.04@sha256:4ff859525f99de5782aa73607ce24219b07dddd48d12b97c1c301d7e1cfb0a87
          - lane: cuda-13-3-cxx23-probe
            toolkit_lane: cuda-13.3
            dialect: c++23
            kind: cxx23-probe
            image: nvidia/cuda:13.3.1-devel-ubuntu24.04@sha256:4ff859525f99de5782aa73607ce24219b07dddd48d12b97c1c301d7e1cfb0a87
    steps:
      - name: Check out canonical public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up exact Node.js for the evidence recorder
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Record UTC verification date
        run: echo "VERIFICATION_DATE=$(date -u +%F)" >> "$GITHUB_ENV"

      - name: Record runner and container-tool coordinates
        run: |
          node -e "console.log(JSON.stringify({ImageOS:process.env.ImageOS,ImageVersion:process.env.ImageVersion,RUNNER_ARCH:process.env.RUNNER_ARCH},null,2))"
          docker version --format '{{.Server.Version}}'
          docker buildx version

      - name: Preprocess, compile, link, inspect, and test the host boundary
        run: >-
          node scripts/run-cuda-compile.mjs
          --check "${{ matrix.lane }}"
          --toolkit-lane "${{ matrix.toolkit_lane }}"
          --dialect "${{ matrix.dialect }}"
          --kind "${{ matrix.kind }}"
          --image "${{ matrix.image }}"

      - name: Scan the sanitized compile record and logs
        run: node scripts/check-artifacts.mjs "artifacts/cuda/${{ matrix.lane }}"

      - name: Upload sanitized compile evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cuda-compile-${{ matrix.lane }}
          path: artifacts/cuda/${{ matrix.lane }}
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7

  ex03-build:
    name: ${{ matrix.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: ex03-cuda-11-8-cxx17
            image: nvidia/cuda:11.8.0-devel-ubuntu22.04@sha256:94fd755736cb58979173d491504f0b573247b1745250249415b07fefc738e41f
          - lane: ex03-cuda-12-9-cxx17
            image: nvidia/cuda:12.9.2-devel-ubuntu24.04@sha256:16656a1ef115bca9e1f820c6349876f1486d2b3c9a0e615773799fe402960dc5
          - lane: ex03-cuda-13-3-cxx17
            image: nvidia/cuda:13.3.1-devel-ubuntu24.04@sha256:4ff859525f99de5782aa73607ce24219b07dddd48d12b97c1c301d7e1cfb0a87
    steps:
      - name: Check out canonical public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up exact Node.js for artifact scanning
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Compile EX03 without granting Evidence Status
        run: |
          mkdir -p "artifacts/cuda-ex03/${{ matrix.lane }}"
          docker pull --platform linux/amd64 "${{ matrix.image }}"
          docker run --platform linux/amd64 --rm --network none \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace/examples/ex03-multidimensional-indexing \
            "${{ matrix.image }}" \
            bash scripts/compile-check.sh c++17 ex03 \
            "/workspace/artifacts/cuda-ex03/${{ matrix.lane }}"

      - name: Scan EX03 build logs
        run: node scripts/check-artifacts.mjs "artifacts/cuda-ex03/${{ matrix.lane }}"

      - name: Upload EX03 build-gate logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cuda-build-${{ matrix.lane }}
          path: artifacts/cuda-ex03/${{ matrix.lane }}
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7

  ex04-build:
    name: ${{ matrix.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: ex04-cuda-11-8-cxx17
            image: nvidia/cuda:11.8.0-devel-ubuntu22.04@sha256:94fd755736cb58979173d491504f0b573247b1745250249415b07fefc738e41f
          - lane: ex04-cuda-12-9-cxx17
            image: nvidia/cuda:12.9.2-devel-ubuntu24.04@sha256:16656a1ef115bca9e1f820c6349876f1486d2b3c9a0e615773799fe402960dc5
          - lane: ex04-cuda-13-3-cxx17
            image: nvidia/cuda:13.3.1-devel-ubuntu24.04@sha256:4ff859525f99de5782aa73607ce24219b07dddd48d12b97c1c301d7e1cfb0a87
    steps:
      - name: Check out canonical public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up exact Node.js for artifact scanning
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Compile EX04 without granting Evidence Status
        run: |
          mkdir -p "artifacts/cuda-ex04/${{ matrix.lane }}"
          docker pull --platform linux/amd64 "${{ matrix.image }}"
          docker run --platform linux/amd64 --rm --network none \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace/examples/ex04-error-handling-lifecycle \
            "${{ matrix.image }}" \
            bash scripts/compile-check.sh c++17 ex04 \
            "/workspace/artifacts/cuda-ex04/${{ matrix.lane }}"

      - name: Scan EX04 build logs
        run: node scripts/check-artifacts.mjs "artifacts/cuda-ex04/${{ matrix.lane }}"

      - name: Upload EX04 build-gate logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cuda-build-${{ matrix.lane }}
          path: artifacts/cuda-ex04/${{ matrix.lane }}
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7

  ex05-build:
    name: ${{ matrix.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: ex05-cuda-11-8-cxx17
            image: nvidia/cuda:11.8.0-devel-ubuntu22.04@sha256:94fd755736cb58979173d491504f0b573247b1745250249415b07fefc738e41f
          - lane: ex05-cuda-12-9-cxx17
            image: nvidia/cuda:12.9.2-devel-ubuntu24.04@sha256:16656a1ef115bca9e1f820c6349876f1486d2b3c9a0e615773799fe402960dc5
          - lane: ex05-cuda-13-3-cxx17
            image: nvidia/cuda:13.3.1-devel-ubuntu24.04@sha256:4ff859525f99de5782aa73607ce24219b07dddd48d12b97c1c301d7e1cfb0a87
    steps:
      - name: Check out canonical public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up exact Node.js for artifact scanning
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Compile EX05 without granting Evidence Status
        run: |
          mkdir -p "artifacts/cuda-ex05/${{ matrix.lane }}"
          docker pull --platform linux/amd64 "${{ matrix.image }}"
          docker run --platform linux/amd64 --rm --network none \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace/examples/ex05-coalesced-strided-access \
            "${{ matrix.image }}" \
            bash scripts/compile-check.sh c++17 ex05 \
            "/workspace/artifacts/cuda-ex05/${{ matrix.lane }}"

      - name: Scan EX05 build logs
        run: node scripts/check-artifacts.mjs "artifacts/cuda-ex05/${{ matrix.lane }}"

      - name: Upload EX05 build-gate logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cuda-build-${{ matrix.lane }}
          path: artifacts/cuda-ex05/${{ matrix.lane }}
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7

  ex06-build:
    name: ${{ matrix.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: ex06-cuda-11-8-cxx17
            image: nvidia/cuda:11.8.0-devel-ubuntu22.04@sha256:94fd755736cb58979173d491504f0b573247b1745250249415b07fefc738e41f
          - lane: ex06-cuda-12-9-cxx17
            image: nvidia/cuda:12.9.2-devel-ubuntu24.04@sha256:16656a1ef115bca9e1f820c6349876f1486d2b3c9a0e615773799fe402960dc5
          - lane: ex06-cuda-13-3-cxx17
            image: nvidia/cuda:13.3.1-devel-ubuntu24.04@sha256:4ff859525f99de5782aa73607ce24219b07dddd48d12b97c1c301d7e1cfb0a87
    steps:
      - name: Check out canonical public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up exact Node.js for artifact scanning
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Compile EX06 without granting Evidence Status
        run: |
          mkdir -p "artifacts/cuda-ex06/${{ matrix.lane }}"
          docker pull --platform linux/amd64 "${{ matrix.image }}"
          docker run --platform linux/amd64 --rm --network none \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace/examples/ex06-shared-memory-tile-bank-padding \
            "${{ matrix.image }}" \
            bash scripts/compile-check.sh c++17 ex06 \
            "/workspace/artifacts/cuda-ex06/${{ matrix.lane }}"

      - name: Scan EX06 build logs
        run: node scripts/check-artifacts.mjs "artifacts/cuda-ex06/${{ matrix.lane }}"

      - name: Upload EX06 build-gate logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cuda-build-${{ matrix.lane }}
          path: artifacts/cuda-ex06/${{ matrix.lane }}
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7

  ex16-build:
    name: ${{ matrix.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: ex16-cuda-11-8-cxx17
            image: nvidia/cuda:11.8.0-devel-ubuntu22.04@sha256:94fd755736cb58979173d491504f0b573247b1745250249415b07fefc738e41f
          - lane: ex16-cuda-12-9-cxx17
            image: nvidia/cuda:12.9.2-devel-ubuntu24.04@sha256:16656a1ef115bca9e1f820c6349876f1486d2b3c9a0e615773799fe402960dc5
          - lane: ex16-cuda-13-3-cxx17
            image: nvidia/cuda:13.3.1-devel-ubuntu24.04@sha256:4ff859525f99de5782aa73607ce24219b07dddd48d12b97c1c301d7e1cfb0a87
    steps:
      - name: Check out canonical public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up exact Node.js for artifact scanning
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Compile EX16 without granting Evidence Status
        run: |
          mkdir -p "artifacts/cuda-ex16/${{ matrix.lane }}"
          docker pull --platform linux/amd64 "${{ matrix.image }}"
          docker run --platform linux/amd64 --rm --network none \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace/examples/ex16-sanitizer-defect-suite \
            "${{ matrix.image }}" \
            bash scripts/compile-check.sh c++17 ex16 \
            "/workspace/artifacts/cuda-ex16/${{ matrix.lane }}"

      - name: Scan EX16 build logs
        run: node scripts/check-artifacts.mjs "artifacts/cuda-ex16/${{ matrix.lane }}"

      - name: Upload EX16 build-gate logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cuda-build-${{ matrix.lane }}
          path: artifacts/cuda-ex16/${{ matrix.lane }}
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7

  cuda-compile-gate:
    name: cuda-compile-gate
    if: ${{ always() }}
    needs: [cuda-compile, ex03-build, ex04-build, ex05-build, ex06-build, ex16-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every declared CUDA compile boundary
        env:
          CUDA_EVIDENCE_RESULT: ${{ needs.cuda-compile.result }}
          EX03_BUILD_RESULT: ${{ needs.ex03-build.result }}
          EX04_BUILD_RESULT: ${{ needs.ex04-build.result }}
          EX05_BUILD_RESULT: ${{ needs.ex05-build.result }}
          EX06_BUILD_RESULT: ${{ needs.ex06-build.result }}
          EX16_BUILD_RESULT: ${{ needs.ex16-build.result }}
        run: |
          if [ "$CUDA_EVIDENCE_RESULT" != "success" ]; then exit 1; fi
          if [ "$EX03_BUILD_RESULT" != "success" ]; then exit 1; fi
          if [ "$EX04_BUILD_RESULT" != "success" ]; then exit 1; fi
          if [ "$EX05_BUILD_RESULT" != "success" ]; then exit 1; fi
          if [ "$EX06_BUILD_RESULT" != "success" ]; then exit 1; fi
          if [ "$EX16_BUILD_RESULT" != "success" ]; then exit 1; fi
          echo "Compile evidence does not grant CUDA runtime evidence."
