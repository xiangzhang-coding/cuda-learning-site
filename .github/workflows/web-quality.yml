# SPDX-License-Identifier: Apache-2.0
name: Web Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NODE_VERSION: 24.19.0

jobs:
  static-and-integration:
    name: static-and-integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Record runner and tool coordinates
        run: |
          node --version
          npm --version
          node -e "console.log(JSON.stringify({ImageOS:process.env.ImageOS,ImageVersion:process.env.ImageVersion,RUNNER_ARCH:process.env.RUNNER_ARCH},null,2))"

      - name: Enforce source allowlist and private-leak boundary
        run: npm run quality:source

      - name: Review exact lockfile, sources, licenses, and install scripts
        run: npm run quality:dependencies

      - name: Enforce file-level license declarations
        run: npm run quality:licenses

      - name: Check canonical Runnable Example imports
        run: npm run quality:canonical-imports

      - name: Install reviewed dependency tree without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Audit dependency vulnerabilities
        run: npm audit --audit-level=high

      - name: Run unit tests with coverage
        run: npm run test:unit

      - name: Run Astro and content diagnostics
        run: npm run check

      - name: Build static site and Pagefind indexes
        run: npm run build

      - name: Validate the assets-only Cloudflare deployment configuration
        run: npm run quality:deployment

      - name: Run Publication Pair, metadata, navigation, link, and integration checks
        run: npm run test:integration

      - name: Scan generated output and Pagefind data
        run: npm run quality:dist

      - name: Build and inspect the source archive boundary
        run: |
          mkdir -p .quality/source-archive
          git archive --format=tar HEAD | tar -xf - -C .quality/source-archive
          node scripts/check-artifacts.mjs .quality/source-archive

      - name: Upload reviewed static output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: site-dist
          path: dist
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7

  e2e-chromium:
    name: e2e-chromium
    needs: static-and-integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install reviewed dependency tree without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Download reviewed static output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: site-dist
          path: dist

      - name: Install pinned Chromium and host dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Chromium built-output checks
        run: npm run test:e2e:chromium

      - name: Produce selected visual evidence
        run: npm run test:e2e:visual

      - name: Scan Chromium reports and screenshots before retention
        id: scan-chromium
        if: ${{ !cancelled() }}
        run: |
          for target in test-results playwright-report; do
            if [ -d "$target" ]; then node scripts/check-artifacts.mjs "$target"; fi
          done

      - name: Upload reviewed Chromium evidence
        if: ${{ always() && steps.scan-chromium.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: chromium-evidence
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          include-hidden-files: false
          retention-days: 7

  e2e-cross-browser:
    name: e2e-cross-browser
    needs: static-and-integration
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install reviewed dependency tree without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Download reviewed static output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: site-dist
          path: dist

      - name: Install pinned Firefox, WebKit, and host dependencies
        run: npx playwright install --with-deps firefox webkit

      - name: Run Firefox, WebKit, and Mobile Safari emulation
        run: npm run test:e2e:cross-browser

      - name: Scan cross-browser reports before retention
        id: scan-cross-browser
        if: ${{ !cancelled() }}
        run: |
          for target in test-results playwright-report; do
            if [ -d "$target" ]; then node scripts/check-artifacts.mjs "$target"; fi
          done

      - name: Upload reviewed cross-browser evidence
        if: ${{ always() && steps.scan-cross-browser.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cross-browser-evidence
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          include-hidden-files: false
          retention-days: 7

  accessibility-automated:
    name: accessibility-automated
    needs: static-and-integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install reviewed dependency tree without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Download reviewed static output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: site-dist
          path: dist

      - name: Install pinned Chromium and host dependencies
        run: npx playwright install --with-deps chromium

      - name: Run automated accessibility checks
        run: npm run test:e2e:accessibility

      - name: Scan accessibility reports before retention
        id: scan-accessibility
        if: ${{ !cancelled() }}
        run: |
          for target in test-results playwright-report; do
            if [ -d "$target" ]; then node scripts/check-artifacts.mjs "$target"; fi
          done

      - name: Upload reviewed accessibility evidence on failure
        if: ${{ failure() && steps.scan-accessibility.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: accessibility-evidence
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          include-hidden-files: false
          retention-days: 7

  artifact-policy:
    name: artifact-policy
    if: ${{ !cancelled() }}
    needs:
      - static-and-integration
      - e2e-chromium
      - e2e-cross-browser
      - accessibility-automated
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download every retained artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: '*'
          path: artifacts

      - name: Re-scan retained artifact contents
        run: node scripts/check-artifacts.mjs artifacts

  web-quality:
    name: web-quality
    if: ${{ always() }}
    needs:
      - static-and-integration
      - e2e-chromium
      - e2e-cross-browser
      - accessibility-automated
      - artifact-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every web quality boundary
        env:
          STATIC_RESULT: ${{ needs.static-and-integration.result }}
          CHROMIUM_RESULT: ${{ needs.e2e-chromium.result }}
          CROSS_BROWSER_RESULT: ${{ needs.e2e-cross-browser.result }}
          ACCESSIBILITY_RESULT: ${{ needs.accessibility-automated.result }}
          ARTIFACT_RESULT: ${{ needs.artifact-policy.result }}
        run: |
          for result in "$STATIC_RESULT" "$CHROMIUM_RESULT" "$CROSS_BROWSER_RESULT" "$ACCESSIBILITY_RESULT" "$ARTIFACT_RESULT"; do
            if [ "$result" != "success" ]; then exit 1; fi
          done
          echo "Web quality does not grant CUDA evidence status."
